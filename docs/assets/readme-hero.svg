<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Smart Trip Planner — Name a city. Get a plan.</title>
  <desc id="desc">Smart Trip Planner turns a plain-language trip request into a location, the current weather and nearby attractions using cooperating geocoding, weather and places agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#0c2a1f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#4ade80" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Smart Trip<tspan fill="#4ade80"> Planner</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Name a city.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">Get a plan.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">Location, today&#x27;s weather and nearby attractions from open data, in one reply.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#4ade80"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">trip / agents</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#4ade80">Mysuru<tspan fill="#94a3b8"> → coordinates</tspan></text>
      <text x="862" y="166" fill="#38bdf8">coordinates<tspan fill="#94a3b8"> → weather</tspan></text>
      <text x="862" y="194" fill="#facc15">coordinates<tspan fill="#94a3b8"> → attractions</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#4ade80" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / ASK</text>
      <text x="352" y="309">02 / LOCATE</text>
      <text x="628" y="309">03 / FORECAST</text>
      <text x="904" y="309">04 / EXPLORE</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Write it in plain words</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">&quot;I&#x27;m going to Mysuru&quot;</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Geocode the place</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">OpenStreetMap Nominatim</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Check the weather</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">Open-Meteo temp + rain</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">List places to visit</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">Overpass, within 5 km</text>
    <text x="56" y="428" fill="#64748b" font-size="13">Python · Flask · OpenStreetMap Nominatim · Open-Meteo · Overpass API · Render</text>
  </g>
</svg>
